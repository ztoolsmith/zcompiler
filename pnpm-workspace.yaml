packages:
  - "packages/*"
  - "playground"

# pnpm refuse par défaut d'installer un paquet publié il y a moins de N jours
# (garde anti-supply-chain). On exempte ce qu'on publie nous-mêmes et qu'on
# réinstalle dans la foulée.
#
# Les paquets de plateforme n'apparaissent PLUS ici : ils ne sont plus déclarés
# dans le package.json committé (cf. « Versionnage et publication »), donc le
# lockfile ne les référence jamais.
minimumReleaseAgeExclude:
  - zignapi@0.4.1
