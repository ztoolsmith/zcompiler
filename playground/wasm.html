<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zcompiler — WASM playground</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
      h1 { font-size: 1.2rem; }
      textarea { width: 100%; height: 8rem; font-family: ui-monospace, monospace; }
      .row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 0.5rem 0; }
      button { padding: 0.3rem 0.7rem; }
      pre { background: #f4f4f4; padding: 0.8rem; overflow: auto; white-space: pre-wrap; }
      .muted { color: #666; }
    </style>
  </head>
  <body>
    <h1>zcompiler dans l'onglet — backend WASM</h1>
    <p class="muted">
      Cette page charge <code>wasm.js</code> (le backend WebAssembly, généré par
      <code>zignapi build --target wasm</code>) et appelle la <strong>même API</strong> que
      côté Node. Smoke test manuel — ouvrir ce fichier après un
      <code>zignapi build --target wasm</code>.
    </p>

    <textarea id="src">const add = (a, b) =&gt; a + b;
let x = add(1, 2 * 3);
</textarea>
    <div class="row">
      <button data-fn="parse">parse</button>
      <button data-fn="print">print</button>
      <button data-fn="tokenize">tokenize</button>
      <button data-fn="parseErrors">parseErrors</button>
      <button data-fn="semantic">semantic</button>
      <button data-fn="transform">transform</button>
      <button data-fn="mangle">mangle</button>
    </div>
    <pre id="out"></pre>

    <!-- wasm.js est auto-suffisant (module WASM embarqué en base64) : aucun fetch,
         API synchrone identique au natif. Il expose le global `zignapi`. -->
    <script src="../packages/zcompiler/wasm.js"></script>
    <script>
      const out = document.getElementById("out");
      const src = document.getElementById("src");
      for (const btn of document.querySelectorAll("button[data-fn]")) {
        btn.addEventListener("click", () => {
          const fn = btn.dataset.fn;
          try {
            const r = zignapi[fn](src.value);
            out.textContent = typeof r === "string" ? r : JSON.stringify(r, null, 2);
          } catch (e) {
            out.textContent = "⚠ " + e.message;
          }
        });
      }
    </script>
  </body>
</html>
